<noscript><p style="max-width:40rem;margin:2rem auto;padding:0 1rem;font:16px/1.5 system-ui,sans-serif">Syntax Tree Sandbox is a browser-native tool for building constituency (phrase-structure) syntax trees by hand. You drag color-coded words into phrase containers such as NP, VP and PP, and the nested boxes morph into a branching tree. It is open-ended, with no preset puzzles, so you can compare different analyses of the same sentence, and export trees as SVG. JavaScript is required. <a href="/SYNTAX/about/">Read how it works</a>. Made by <a href="https://calvinhancock.com/">Calvin W. Hancock</a>.</p></noscript>

<style>
/* Layout: workbench — inventory docks on the left, dotted bench canvas on the right; trees grow on the bench. */
:root{
  --bg:#e8ebf0; --panel:#f6f7fa; --bench:#fbfcfd; --dot:#cdd3dd;
  --ink:#151921; --ink2:#535c6c; --line:#cfd4dd; --line2:#97a0b0;
  --chip:#d6d9df; --box:#ffffff; --ok:#14965a; --warn:#b86f00; --bad:#d4344b;
  --cls-white:#6e7685; --on-white:#ffffff;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1117; --panel:#151920; --bench:#11151b; --dot:#262c37;
  --ink:#e8ebf1; --ink2:#959daa; --line:#29303b; --line2:#4d5767;
  --chip:#2b313c; --box:#1a1f28; --ok:#3fcf82; --warn:#f2a73a; --bad:#ff6177; --cls-white:#eef0f4; --on-white:#151921; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1117; --panel:#151920; --bench:#11151b; --dot:#262c37;
  --ink:#e8ebf1; --ink2:#959daa; --line:#29303b; --line2:#4d5767;
  --chip:#2b313c; --box:#1a1f28; --ok:#3fcf82; --warn:#f2a73a; --bad:#ff6177; --cls-white:#eef0f4; --on-white:#151921; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;max-width:1480px;margin:0 auto 14px}
.brand h1{font-family:var(--display);font-weight:700;font-size:clamp(24px,3.2vw,34px);letter-spacing:-.02em;margin:0;line-height:1.05;text-wrap:balance}
.brand p{margin:4px 0 0;color:var(--ink2);max-width:62ch}
.btn{border:1px solid var(--line2);background:transparent;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px}
.btn:hover{background:var(--chip)}
.addwords{display:flex;gap:6px;margin-bottom:10px}
.addwords input{flex:1;min-width:0;font:inherit;font-family:var(--mono);font-size:13px;padding:6px 9px;border-radius:8px;border:1px solid var(--line2);background:var(--bench);color:var(--ink)}
.inv .word.editing{outline:2px solid var(--ink);outline-offset:2px}
.inv .word.used{cursor:pointer}
.wedit{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.wedit-head{display:flex;align-items:baseline;gap:8px;width:100%}
.wedit-head b{font-family:var(--mono);font-size:15px}
.wedit-head span{color:var(--ink2);font-size:12.5px}
.wedit-head .btn{margin-left:auto}
.wedit-pos{display:flex;flex-wrap:wrap;gap:6px}
.posbtn{font-family:var(--mono);font-size:12px;font-weight:700;border:2px solid var(--c);color:var(--c);background:transparent;border-radius:8px;padding:4px 9px;cursor:pointer}
.posbtn[aria-pressed="true"]{background:var(--c);color:#fff}
.word.on-white,.posbtn.on-white[aria-pressed="true"]{color:var(--on-white);text-shadow:none}
.word.on-white small{background:rgba(127,127,127,.22)}
.btn.small{padding:3px 9px;font-size:12px}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.nullchip{background:var(--chip);color:var(--ink);text-shadow:none;font-family:var(--mono)}
.nullchip small{background:transparent;border:1px solid var(--line2)}
.nullpill{font-weight:700;padding-inline:14px}
.tword.null{border-bottom:3px dashed var(--line2);color:var(--ink2)}
.inv-empty{color:var(--ink2);font-size:12.5px}

.layout{max-width:1480px;width:100%;margin:0 auto;display:grid;grid-template-columns:290px minmax(0,1fr);gap:14px;align-items:stretch;flex:1}
.top{width:100%;align-items:flex-start}
.legendbar{flex:1;min-width:0}
.scorepop{position:absolute;left:50%;top:14px;z-index:60;display:flex;align-items:baseline;gap:14px;padding:9px 16px;
  border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--ink2);font-size:13px;
  box-shadow:0 8px 28px rgba(0,0,0,.18);pointer-events:none;opacity:0;transform:translate(-50%,-10px);transition:opacity .3s,transform .3s}
.scorepop.show{opacity:1;transform:translate(-50%,0)}
.scorepop{white-space:nowrap}
@media (max-width:520px){.scorepop{gap:9px;padding:7px 12px;font-size:12px}.scorepop .sc b{font-size:14px}}
.scorepop .sc b{font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums;margin-right:3px}
.scorepop .sc-gain{font-weight:700;color:var(--ok)}
.fx{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;z-index:5}
.fx-pts{position:absolute;transform:translate(-50%,-50%);font:700 14px/1 var(--mono);color:var(--ok);white-space:nowrap;
  text-shadow:0 0 6px var(--bench),0 0 2px var(--bench);animation:fxrise 1.3s ease-out forwards}
@keyframes fxrise{0%{opacity:0;transform:translate(-50%,-30%) scale(.85)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}100%{opacity:0;transform:translate(-50%,-190%) scale(1)}}
.fx-flash{position:absolute;border-radius:12px;background:color-mix(in srgb,var(--ok) 22%,transparent);
  box-shadow:0 0 0 2px var(--ok),0 0 26px color-mix(in srgb,var(--ok) 55%,transparent);animation:fxflash 1.4s ease-out forwards}
@keyframes fxflash{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.scorepop{transition:none}.fx-pts{animation:fxfade 1.3s linear forwards}.fx-flash{animation:fxfade 1.4s linear forwards}}
@keyframes fxfade{0%,60%{opacity:1}100%{opacity:0}}
.exportbtn{flex:none;font-weight:600;padding:7px 14px;border-color:var(--ink);background:var(--panel)}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr)}}
.docks{display:flex;flex-direction:column;gap:14px;min-width:0}
.dock{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px 14px;transition:background .15s}
.dock.drop-ok{background:color-mix(in srgb,var(--bad) 10%,var(--panel))}
.dock h2{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink2);font-weight:500;margin:0 0 10px;display:flex;justify-content:space-between}
.dock h3{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink2);font-weight:400;margin:12px 0 6px}
.inv{display:flex;flex-wrap:wrap;gap:7px}

/* chips */
.word{display:inline-flex;align-items:center;gap:6px;color:#fff;font-weight:600;border-radius:999px;padding:5px 12px;font-size:15px;
  text-shadow:0 1px 0 rgba(0,0,0,.22);cursor:grab;touch-action:none;user-select:none;white-space:nowrap;line-height:1.2}
.word small{font-family:var(--mono);font-size:10px;font-weight:500;opacity:.9;background:rgba(0,0,0,.18);border-radius:6px;padding:1px 5px}
.inv .word.used{opacity:.22;cursor:default;filter:grayscale(.6)}
.inv-lex,.inv-phr{font-family:var(--mono);font-size:13px;border-radius:999px;padding:4px 11px;cursor:grab;touch-action:none;user-select:none}
.inv-lex{border:2px solid var(--c);color:var(--c);background:var(--box);font-weight:700}
.inv-lex.legend{cursor:default;touch-action:auto}
.dock-hint{margin:-4px 0 10px;color:var(--ink2);font-size:12.5px;line-height:1.4}
.cardgrid{display:grid;grid-template-columns:1fr;gap:6px}
@media (max-width:860px){.cardgrid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}}
.pcard{display:grid;grid-template-columns:auto auto minmax(0,1fr);align-items:center;gap:9px;background:var(--box);border:1px solid var(--line2);border-radius:10px;padding:7px 10px 7px 8px;
  cursor:grab;touch-action:none;user-select:none;box-shadow:0 1px 0 var(--line),0 3px 8px -6px rgba(0,0,0,.4);transition:transform .12s,box-shadow .12s,border-color .12s}
.pcard:hover{transform:translateY(-1px);border-color:var(--ink);box-shadow:0 2px 0 var(--line),0 8px 16px -8px rgba(0,0,0,.45)}
.pcard:active{cursor:grabbing}
.grip{width:8px;height:14px;background-image:radial-gradient(var(--ink2) 1.2px,transparent 1.6px);background-size:4px 4.6px;opacity:.8}
.pc-tag{font-family:var(--mono);font-weight:700;font-size:13px;background:var(--chip);border-radius:999px;padding:2px 9px}
.pc-name{color:var(--ink2);font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.legendbar{display:flex;flex-wrap:wrap;gap:6px}
.legendgrid{display:grid;grid-template-columns:1fr;gap:5px}
.legrow{display:flex;align-items:center;gap:10px;min-width:0}
.legrow .inv-lex{min-width:52px;text-align:center}
.legname{font-size:13px;color:var(--ink);min-width:0}
@media (max-width:860px){.legendgrid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}}
.legend-note{text-transform:none;letter-spacing:0;margin-left:6px;opacity:.8}
.inv-phr{background:var(--chip);border:1px solid transparent}
.inv-phr.co{font-size:12px}
.inv-phr:hover{border-color:var(--line2)}

/* bench */
.work{display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0}
.benchwrap{position:relative;flex:1;display:flex;flex-direction:column;min-height:440px}
@media (max-width:860px){.benchwrap{min-height:72vh}}
.benchbar{position:absolute;top:8px;right:10px;z-index:5;display:flex;gap:6px;background:color-mix(in srgb,var(--bench) 85%,transparent);padding:4px;border-radius:10px}
.benchbar .btn{background:var(--panel)}
.benchbar .btn:disabled{opacity:.4;cursor:default}
.bench{position:relative;flex:1;min-height:0;overflow:auto;border:1px solid var(--line);border-radius:14px;
  background-color:var(--bench);background-image:radial-gradient(var(--dot) 1.1px,transparent 1.6px);background-size:22px 22px;background-attachment:local}
.canvas{position:relative;min-width:100%;min-height:100%}
.hint-empty{position:absolute;left:24px;top:22px;color:var(--ink2);font-family:var(--mono);font-size:12px;pointer-events:none;max-width:44ch}
.rootwrap{position:absolute;pointer-events:none}
/* only the visible pieces catch the pointer; the empty area of a big node lets clicks through */
.rootwrap .tlabel,.rootwrap .tword,.rootwrap .slot,.rootwrap .pbox,.rootwrap .lbox,.rootwrap>.word,.rootwrap button{pointer-events:auto}

/* box mode */
.pbox{display:inline-flex;flex-direction:column;gap:7px;border:2px dashed var(--line2);border-radius:13px;background:var(--box);padding:6px 9px 9px;
  box-shadow:0 1px 0 var(--line),0 6px 16px -10px rgba(0,0,0,.35);transition:border-color .2s}
.pbox[data-status="complete"]{border-style:solid;border-color:var(--ink)}
.phead{display:flex;align-items:center;gap:8px}
.ptag{font-family:var(--mono);font-size:13px;font-weight:700;background:var(--chip);border-radius:999px;padding:2px 10px;cursor:grab;touch-action:none;user-select:none}
.pbox[data-status="complete"]>.phead .ptag{background:var(--ink);color:var(--bg)}
.pstate{font-family:var(--mono);font-size:10.5px;color:var(--ink2)}
.slots{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.slot{font-family:var(--mono);font-size:11.5px;border:1.5px dashed var(--c,var(--line2));color:var(--c,var(--ink2));border-radius:999px;padding:3px 9px;white-space:nowrap;user-select:none}
.slot.opt{opacity:.85;border-color:var(--line2);color:color-mix(in srgb,var(--tc,var(--ink2)) 55%,var(--ink2))}
.slot.req{border:2px dashed color-mix(in srgb,var(--ink) 80%,transparent);color:var(--tc,var(--ink));font-weight:700;opacity:1}
.lbox{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--c);border-radius:999px;padding:2px 3px 2px 9px;background:var(--box)}
.lbox[data-status="partial"]{border-style:dashed}
.ltag{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--c);cursor:grab;touch-action:none;user-select:none}
.lbox .word{font-size:14px;padding:3px 10px}

/* tree mode */
.troot{position:relative;isolation:isolate;padding:12px 16px 14px}
.troot svg.lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:0}
.troot svg line{stroke:var(--ink);stroke-width:1.4;stroke-linecap:round}
.troot svg line.grow{stroke-dasharray:1;stroke-dashoffset:1;animation:grow .55s .12s cubic-bezier(.3,.7,.2,1) forwards}
@keyframes grow{to{stroke-dashoffset:0}}
.tnode{position:relative;display:flex;flex-direction:column;align-items:center;border-radius:10px;padding:2px 4px}
.tlabel{position:relative;z-index:1;font-family:var(--mono);font-size:14px;padding:2px 8px;border-radius:6px;cursor:grab;touch-action:none;user-select:none;background:var(--bench);white-space:nowrap}
.tnode[data-status="partial"]>.tlabel{outline:1.5px dashed var(--warn);outline-offset:1px}
.tnode[data-status="partial"]>.tlabel:not(.headed){color:var(--warn)}
.tlabel.headed{color:var(--hc);font-weight:700}
.inv-phr.headed{background:color-mix(in srgb,var(--c) 22%,var(--panel));border-color:color-mix(in srgb,var(--c) 70%,transparent);color:var(--ink)}
.tkids{display:flex;align-items:flex-start;gap:20px;margin-top:40px}
.tword{position:relative;z-index:1;margin-top:8px;font-family:var(--mono);font-size:17px;border-bottom:4px solid var(--c);line-height:1.15;cursor:grab;touch-action:none;user-select:none;white-space:nowrap;background:var(--bench);padding:0 2px}
.tnode .slot{margin-top:8px;position:relative;z-index:1;background:var(--bench)}
.tkids>.ghost{position:relative;z-index:1;background:var(--bench);margin-top:0;border-radius:999px}
.tkids>.ghost.opt .slot{opacity:.8}
.tnode.morph::before{content:"";position:absolute;inset:-6px -8px;border:2px solid var(--ink);border-radius:13px;background:var(--box);z-index:-1;pointer-events:none;animation:dissolve .7s cubic-bezier(.4,0,.2,1) forwards}
.tnode.morph>.tlabel{animation:unbox .7s ease forwards}
@keyframes dissolve{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.05)}}
@keyframes unbox{0%{background:var(--chip);border-radius:999px}100%{background:var(--bench)}}

/* selection & delete */
.word,.ltag{position:relative}
.del{position:absolute;top:-11px;right:-13px;width:20px;height:20px;border-radius:50%;border:2px solid var(--bench);background:var(--bad);color:#fff;font:700 12px/1 var(--body);padding:0;cursor:pointer;z-index:3;display:grid;place-items:center;text-shadow:none}
.del:hover{filter:brightness(1.1)}
.word.selected,.lbox.selected{outline:2px solid var(--ink);outline-offset:2px}
.tnode.selected>.tlabel,.tword.selected{outline:2px solid var(--ink);outline-offset:2px}

.optbtn{position:absolute;left:100%;top:50%;transform:translateY(-50%);margin-left:6px;font-family:var(--mono);font-size:10.5px;white-space:nowrap;border:1px solid var(--line2);background:var(--bench);color:var(--ink2);border-radius:999px;padding:1px 7px;cursor:pointer;z-index:2}
.optbtn:hover{color:var(--ink);border-color:var(--ink)}
.optbtn{display:none;z-index:4}
.tlabel:hover>.optbtn,.tnode.selected>.tlabel>.optbtn{display:block}
.tnode.selected>.tlabel .optbtn{margin-left:18px}

/* drag feedback */
.can-drop.pbox,.can-drop.lbox{border-color:var(--ok)}
.tnode.can-drop>.tlabel{box-shadow:0 0 0 2px color-mix(in srgb,var(--ok) 55%,transparent)}
.drop-ok.pbox,.drop-ok.lbox{outline:3px solid var(--ok);outline-offset:3px}
.drop-no.pbox,.drop-no.lbox{outline:3px solid var(--bad);outline-offset:3px}
.tnode.drop-ok>.tlabel{background:var(--ok);color:#fff}
.tnode.drop-no>.tlabel{background:var(--bad);color:#fff}

<script>
const DEFAULT_GRAMMAR={
  pos:[['N','Noun','#a0693a'],['D','Determiner','var(--cls-white)'],['V','Verb','#2f78f0'],['Adj','Adjective','#df12ae'],['Adv','Adverb','#e82a5b'],['P','Preposition','#f3661f'],['T','Tense','#e09f00'],['C','Complementizer','#1faa3a'],['Conj','Conjunction','#8f45f0']].map(([tag,name,color])=>({tag,name,color})),
  rules:['CP -> (Conj) ({NP/PP/AdvP/AdjP/CP}) ({C/T}) TP','TP -> {NP/CP} (AdvP+) (T) VP','VP -> (AdvP+) {V/V_Conj} Comps (AdvP+) (PP+) (AdvP+)','NP -> (AdvP) (D) ({D/DP}) (AdjP+) (N+) {N/N_Conj} (PP+) (CP)','NP -> (AdvP) {D/DP} AdjP+ (PP+)','PP -> (AdvP) {P/P_Conj} ({NP/CP})','AdvP -> (AdvP) {Adv/Adv_Conj} (PP)','AdjP -> (AdvP) {Adj/Adj_Conj} ({PP/CP})','DP -> NP D']
};
const cloneG=g=>JSON.parse(JSON.stringify(g));
let G=cloneG(DEFAULT_GRAMMAR);
let COLORS={},LEX=[],LEXNAMES={},RULES={},PHRASES=[],COORD_HEADS=[];
const COORD=['X_Conj'];
/* built-in punctuation class: Semi ( ; ) joins clauses inside X_Conj */
const PUNCT={Semi:{name:'Semicolon',color:'#8b93a3'}};
const CLAUSES=['CP','TP'];
const isLex=c=>LEX.includes(c)||c in PUNCT;
function applyGrammar(){
  COLORS={};LEXNAMES={};G.pos.forEach(p=>{COLORS[p.tag]=p.color;LEXNAMES[p.tag]=p.name});
  for(const k in PUNCT){COLORS[k]=PUNCT[k].color;LEXNAMES[k]=PUNCT[k].name}
  LEX=G.pos.map(p=>p.tag);
  RULES=parseRules(G.rules.join('\n'));
  PHRASES=Object.keys(RULES);
  COORD_HEADS=[...LEX.filter(c=>c!=='Conj'),...PHRASES];
  if(typeof frameColors==='function')frameColors();
}
/* ---------- verb frames (subcategorization): the verb decides what follows it ----------
   A rule can say Comps where the head verb's complements go; each frame fills Comps differently. */
const COMPS='Comps';
const FRAMES={
  i:{name:'Intransitive',hint:'takes nothing after it',pat:'',mix:['#0ec8f0',.6],col:'#1fa2e6'},
  t:{name:'Transitive',hint:'takes one object: a noun phrase, a clause or a verb phrase',pat:'{NP/CP/VP}',mix:null,col:'#2f78f0'},
  d:{name:'Ditransitive',hint:'takes two complements',pat:'NP {NP/PP/CP/AdjP/VP}',mix:['#0b1450',.6],col:'#1e2f8a'},
  l:{name:'Linking',hint:'links to a description or another verb: is happy, seems fine, has eaten',pat:'{AdjP/NP/PP/VP/CP}',mix:['#b4a8ff',.6],col:'#7b8cf5'}
};
const FKEYS=Object.keys(FRAMES);
const FRAME_ELS={};FKEYS.forEach(f=>FRAME_ELS[f]=FRAMES[f].pat?FRAMES[f].pat.split(/\s+/).map(parseTok):[]);
let FRAMECOL={};
function mixHex(a,b,t){const h=x=>[1,3,5].map(i=>parseInt(x.slice(i,i+2),16));const A=h(a),B=h(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')}
function frameColors(){const base=COLORS.V||'#2f78f0',hex=/^#[0-9a-f]{6}$/i.test(base);FRAMECOL={};FKEYS.forEach(f=>{const m=FRAMES[f].mix;FRAMECOL[f]=base.toLowerCase()==='#2f78f0'?FRAMES[f].col:hex&&m?mixHex(base,m[0],m[1]):base})}
const VERB_FRAMES={
 sleep:'i',arrive:'i',die:'i',laugh:'i',cry:'i',sneeze:'i',bark:'i',smile:'i',go:'i',come:'i',fall:'i',exist:'i',happen:'i',sit:'i',lie:'i',jump:'i',wait:'i',rise:'i',disappear:'i',occur:'i',live:'i',work:'i',talk:'i',dance:'i',snore:'i',yawn:'i',vanish:'i',emerge:'i',
 stand:'it',swim:'it',run:'it',walk:'it',fly:'it',sing:'itd',play:'it',smell:'lti',stay:'li',appear:'li',grow:'itl',turn:'lti',
 see:'tid',like:'t',love:'t',hate:'t',want:'t',need:'t',know:'ti',think:'ti',say:'t',eat:'ti',drink:'ti',read:'tid',write:'tid',chase:'t',hit:'t',kick:'t',build:'td',open:'ti',close:'ti',break:'ti',watch:'tid',hear:'tid',use:'t',hold:'t',carry:'t',catch:'t',
 buy:'td',sell:'tdi',keep:'tdl',leave:'tid',help:'tid',meet:'ti',believe:'t',remember:'t',forget:'t',enjoy:'t',destroy:'t',create:'t',print:'t',call:'td',find:'td',visit:'t',cut:'t',wash:'t',push:'t',pull:'t',save:'t',load:'t',delete:'t',
 try:'t',plan:'t',decide:'ti',hope:'ti',expect:'t',start:'ti',stop:'ti',begin:'ti',finish:'ti',draw:'tid',cook:'tid',bake:'tdi',throw:'td',take:'td',make:'td',do:'t',get:'tdl',have:'tl',
 give:'dt',put:'d',place:'d',set:'dt',show:'dt',tell:'dt',send:'dt',lend:'d',offer:'dt',teach:'dti',ask:'dt',pay:'dti',hand:'d',pass:'dti',owe:'d',bring:'dt',move:'tid',add:'td',remove:'td',copy:'td',store:'td',return:'tid',wish:'dt',
 be:'l',seem:'l',become:'l',remain:'l',look:'li',feel:'ltd',let:'d',sound:'l',taste:'lt',prove:'lt'};
const IRREG={am:'be',is:'be',are:'be',was:'be',were:'be',been:'be',being:'be',has:'have',had:'have',having:'have',did:'do',done:'do',does:'do',went:'go',gone:'go',saw:'see',seen:'see',ate:'eat',eaten:'eat',gave:'give',given:'give',took:'take',taken:'take',made:'make',said:'say',thought:'think',knew:'know',known:'know',wrote:'write',written:'write',ran:'run',came:'come',fell:'fall',fallen:'fall',found:'find',got:'get',gotten:'get',brought:'bring',bought:'buy',sold:'sell',told:'tell',taught:'teach',caught:'catch',built:'build',sent:'send',lent:'lend',left:'leave',kept:'keep',held:'hold',met:'meet',sat:'sit',stood:'stand',lay:'lie',lain:'lie',slept:'sleep',drank:'drink',drunk:'drink',swam:'swim',swum:'swim',flew:'fly',flown:'fly',drew:'draw',drawn:'draw',threw:'throw',thrown:'throw',broke:'break',broken:'break',began:'begin',begun:'begin',sang:'sing',sung:'sing',rose:'rise',risen:'rise',grew:'grow',grown:'grow',became:'become',felt:'feel',heard:'hear',paid:'pay',forgot:'forget',forgotten:'forget',showed:'show',shown:'show'};
function lemma(t){const w=t.toLowerCase();if(IRREG[w])return IRREG[w];if(VERB_FRAMES[w])return w;
  const c=[];if(/ies$/.test(w))c.push(w.slice(0,-3)+'y');if(/ied$/.test(w))c.push(w.slice(0,-3)+'y');
  if(/es$/.test(w))c.push(w.slice(0,-2));if(/s$/.test(w))c.push(w.slice(0,-1));
  if(/ed$/.test(w)){c.push(w.slice(0,-2),w.slice(0,-1));if(/(.)\1ed$/.test(w))c.push(w.slice(0,-3))}
  if(/ing$/.test(w)){c.push(w.slice(0,-3),w.slice(0,-3)+'e');if(/(.)\1ing$/.test(w))c.push(w.slice(0,-4))}
  return c.find(x=>VERB_FRAMES[x])||null}
function guessFrames(t){const l=lemma(t);return l?[...VERB_FRAMES[l]]:['t','i']}
function wordFrames(k){const w=S.words[k];return w.frames&&w.frames.length?w.frames:guessFrames(w.text)}
/* the frames a child offers if it is the verb of its phrase (a verb word, a V box, or verbs joined by and) */
function verbFrames(id){const n=S.nodes[id];if(!n)return null;
  if(n.type==='word')return S.words[n.wid].cats.includes('V')?wordFrames(n.wid):null;
  if(n.type!=='node')return null;
  if(n.cat==='V'){const c=n.children[0];return c?verbFrames(c):null}
  if(n.cat==='X_Conj'&&coordCands(n).includes('V')){const fs=n.children.map(verbFrames).filter(Boolean);if(!fs.length)return null;const both=fs[0].filter(f=>fs.every(x=>x.includes(f)));return both.length?both:fs[0]}
  return null}
function headFrames(n){for(const c of n.children){const f=verbFrames(c);if(f)return f}return null}
const hasComps=rules=>rules.some(r=>r.els.some(e=>e.comps));
function expandRule(r,fr){const ci=r.els.findIndex(e=>e.comps);if(ci<0)return[r];
  return fr.map(f=>({lhs:r.lhs,toks:r.toks,frame:f,els:[...r.els.slice(0,ci),...FRAME_ELS[f],...r.els.slice(ci+1)]}))}
/* which frame each verb ended up using in the current render */
let FPICK=new Map();
function markFrame(id,f){const n=S.nodes[id];if(!n)return;if(n.type==='word')FPICK.set(id,f);else if(n.type==='node')n.children.forEach(c=>markFrame(c,f))}
function noteFrames(n,ev){if(ev&&ev.al&&ev.rule&&ev.rule.frame)n.children.forEach(c=>{if(verbFrames(c))markFrame(c,ev.rule.frame)})}
function catColor(cat,id){if(cat!=='V')return COLORS[cat];const n=S.nodes[id];const f=FPICK.get(id)||(n&&n.type==='word'?wordFrames(n.wid)[0]:null);return f?FRAMECOL[f]:COLORS.V}
/* head of a phrase: XP is headed by X; otherwise the first required word class in its rule */
function headOf(cat){
  if(!cat||!RULES[cat])return null;
  if(cat.endsWith('P')&&LEX.includes(cat.slice(0,-1)))return cat.slice(0,-1);
  for(const r of RULES[cat])for(const el of r.els)if(el.min>0){const a=el.alts.map(x=>x.replace(/_Conj$/,'')).find(x=>LEX.includes(x));if(a)return a}
  return null;
}
/* X_Conj -> X Conj X, both X the same. Heads give N_Conj, V_Conj…; phrases give the phrase itself (NP Conj NP is an NP). */
const coordOut=X=>isLex(X)?X+'_Conj':X;
const coordRule=X=>({lhs:coordOut(X),els:[{alts:[X],min:1,max:Infinity},{alts:CLAUSES.includes(X)?['Conj','Semi']:['Conj'],min:1,max:1},{alts:[X],min:1,max:1}]});
function coordCands(n){const kids=n.children.map(opts);return COORD_HEADS.filter(X=>align(coordRule(X).els,kids,true))}
/* friendly display names; rules keep TP/CP internally and accept either name */
const DISPLAY={TP:'Block',CP:'Clause',X_Conj:'Coord'};
/* a coordinated X ("cats and dogs") is still an X, so N_Conj, V_Conj… display as N, V… */
const shown=c=>DISPLAY[c]||(/_Conj$/.test(c)?shown(c.slice(0,-5)):c);
const altsLabel=alts=>[...new Set(alts.map(a=>a==='Semi'?';':shown(a)))].join('/');
/* a rule token as written, minus the X_Conj alternatives that coordination already implies */
function tokLabel(t){let pre='',post='',b=t;if(b.startsWith('(')&&b.endsWith(')')){pre='(';post=')';b=b.slice(1,-1)}
  let plus='';if(b.endsWith('+')){plus='+';b=b.slice(0,-1)}
  const alts=b.startsWith('{')?b.slice(1,-1).split('/'):[b],lab=[...new Set(alts.map(shown))];
  return pre+(lab.length>1?'{'+lab.join('/')+'}':lab[0])+plus+post}
const toDisplay=t=>t.replace(/\b(TP|CP)\b/g,m=>DISPLAY[m]);
const fromDisplay=t=>t.replace(/\b(Block|Sentence)\b/g,'TP').replace(/\bClause\b/g,'CP');
function rawCat(n){if(n.type==='empty')return'∅';if(n.cat!=='X_Conj')return n.cat;const c=coordCands(n);return c.length===1?coordOut(c[0]):'X_Conj'}
function dispCat(n){return shown(rawCat(n))}
function parseTok(raw){
  let tok=raw,opt=false,plus=false;
  if(tok.startsWith('(')&&tok.endsWith(')')){opt=true;tok=tok.slice(1,-1)}
  if(tok.endsWith('+')){plus=true;tok=tok.slice(0,-1)}
  const alts=tok.startsWith('{')?tok.slice(1,-1).split('/'):[tok];
  return {alts,min:opt?0:1,max:plus?Infinity:1,raw,comps:tok===COMPS};
}
function parseRules(t){
  const R={};
  t.trim().split('\n').filter(l=>l.trim()).forEach(line=>{
    const [lhs,rhs]=line.split(/->|→/).map(s=>s.trim());
    const toks=rhs.split(/\s+/);
    const els=toks.map(parseTok);
    (R[lhs]=R[lhs]||[]).push({lhs,els,toks});
  });
  return R;
}
applyGrammar();

/* ---------- grammar editing ---------- */
const ID=/^[A-Za-z][A-Za-z0-9_']*$/;
const lhsOf=line=>line.split(/->|→/)[0].trim();
function tokAlts(raw){let t=raw;if(t.startsWith('(')&&t.endsWith(')'))t=t.slice(1,-1);if(t.endsWith('+'))t=t.slice(0,-1);return t.startsWith('{')&&t.endsWith('}')?t.slice(1,-1).split('/'):[t]}
function ruleRefs(line){const r=line.split(/->|→/)[1]||'';return r.trim().split(/\s+/).filter(Boolean).flatMap(tokAlts)}
function checkRule(line,skip){
  const m=line.split(/->|→/);
  if(m.length!==2)return'Write it as a phrase, an arrow, then its parts, e.g. QP -> (Deg) Q';
  const lhs=m[0].trim(),rhs=m[1].trim();
  if(!ID.test(lhs))return`“${lhs}” isn't a valid category name. Use letters, digits and _.`;
  if(isLex(lhs))return`${lhs} is a word class. Put a phrase name on the left, such as ${lhs}P.`;
  if(/_Conj$/.test(lhs))return'Coordination is built in (Coord). Pick a name that doesn\'t end in _Conj.';
  if(lhs in PUNCT)return`${lhs} is built in. Pick another name.`;
  if(!rhs)return'Add at least one part after the arrow.';
  const known=new Set([...LEX,...G.rules.filter((_,i)=>i!==skip).map(lhsOf),lhs,'X_Conj',COMPS]);

function rBox(id,pick){
  const n=S.nodes[id];
  if(n.type==='empty')return`<span class="word nullchip${sel(id)}" data-id="${id}" data-drag="${id}"${par(n)}>${pick&&pick!=='*'?`<small>${pick}</small>`:''}∅${delBtn(id)}</span>`;
  if(n.type==='word'){
    const w=S.words[n.wid],bg=pick?catColor(pick,id):chipBg(w.cats,n.wid);
    return`<span class="word${sel(id)}${onWhite(pick?[pick]:w.cats)}" data-id="${id}" data-drag="${id}"${par(n)} style="background:${bg}">${pick?`<small>${pick}</small>`:''}${esc(w.text)}${!pick&&w.cats.length>1?`<small>${w.cats.join('·')}</small>`:''}${delBtn(id)}</span>`;
  }
  modes[id]='box';
  if(isLex(n.cat)){
    const c=n.children[0],ev=evalNode(n);
    return`<span class="lbox${sel(id)}" data-id="${id}" data-drop data-status="${ev.status}"${par(n)} style="--c:${COLORS[n.cat]}"><span class="ltag" data-drag="${id}">${n.cat}${delBtn(id)}</span>${c?rBox(c,n.cat):`<span class="slot req">word</span>`}</span>`;
  }
  const ev=evalNode(n);noteFrames(n,ev);let inner='';
  if(ev.al){for(const s of ev.al){const el=ev.rule.els[s.el];if(s.picks.length)s.picks.forEach((cat,t)=>inner+=rBox(n.children[s.from+t],cat));else inner+=slotPill(el)}}
  else inner=n.children.map(c=>rBox(c)).join('');
  const miss=missing(ev),st=ev.status==='complete'?'':miss.length?'needs '+miss.join(', '):'';
  return`<div class="pbox" data-id="${id}" data-drop data-status="${ev.status}"${par(n)}><div class="phead"><span class="ptag" data-drag="${id}">${esc(dispCat(n))}</span><span class="pstate">${esc(st)}</span></div><div class="slots">${inner}</div></div>`;
}
function rTree(id,pick){
  const n=S.nodes[id];
  if(n.type==='empty'){const cat=pick&&pick!=='*'?pick:'?';
    return`<div class="tnode leaf empty${sel(id)}" data-id="${id}"${par(n)}><span class="tlabel">${esc(cat)}</span><span class="tword null" data-drag="${id}">∅${delBtn(id)}</span></div>`}
  if(n.type==='word'){
    const w=S.words[n.wid],cat=pick||w.cats[0];
    return`<div class="tnode leaf${sel(id)}" data-id="${id}"${par(n)}><span class="tlabel">${cat}</span><span class="tword" data-drag="${id}" style="--c:${catColor(cat,id)}"${cat==='V'?` title="${esc(frameTitle(id))}"`:''}>${esc(w.text)}${delBtn(id)}</span></div>`;
  }
  const m=prevMode[id]==='box'?' morph':'';modes[id]='tree';
  if(isLex(n.cat)){
    const c=n.children[0],ev=evalNode(n);
    const body=c?`<span class="tword${sel(c)}" data-drag="${c}" style="--c:${catColor(n.cat,c)}">${esc(S.words[S.nodes[c].wid].text)}${delBtn(c)}</span>`:`<span class="slot req" style="--c:${COLORS[n.cat]}">word</span>`;
    return`<div class="tnode leaf${m}${sel(id)}" data-id="${id}" data-drop data-status="${ev.status}"${par(n)}><span class="tlabel" data-drag="${id}">${n.cat}${delBtn(id)}</span>${body}</div>`;
  }
  const ev=evalNode(n);noteFrames(n,ev);let kids='';
  let hasOpt=false;
  if(ev.al){for(const s of ev.al){const el=ev.rule.els[s.el];if(s.picks.length)s.picks.forEach((cat,t)=>kids+=rTree(n.children[s.from+t],cat));else if(el.min)kids+=`<div class="ghost">${slotPill(el)}</div>`;else{hasOpt=true;if(n.showOpt)kids+=`<div class="ghost opt">${slotPill(el)}</div>`}}}
  else kids=n.children.map(c=>rTree(c)).join('');
  const optBtn=hasOpt?`<button class="optbtn" type="button" data-opt="${id}" title="${n.showOpt?'Hide optional slots':'Show optional slots'}">${n.showOpt?'− optional':'+ optional'}</button>`:'';
  return`<div class="tnode${m}${sel(id)}" data-id="${id}" data-drop data-status="${ev.status}"${par(n)}><span class="tlabel${hcol(n)?' headed':''}" data-drag="${id}"${hcol(n)?` style="--hc:${hcol(n)}"`:''}>${esc(dispCat(n))}${delBtn(id)}${optBtn}</span>${kids?`<div class="tkids">${kids}</div>`:''}</div>`;
}
function rRoot(id,done){
  const n=S.nodes[id],tree=n.type==='node'&&!isLex(n.cat);
  const html=tree?`<div class="troot"><svg class="lines" aria-hidden="true"></svg>${rTree(id)}</div>`:rBox(id);
  return`<div class="rootwrap${done.includes(id)?' solved':''}" style="left:${n.x}px;top:${n.y}px">${html}</div>`;
}

let lineRefs=[];
function drawLines(){
  lineRefs=[];const keys=new Set();
  canvas.querySelectorAll('.troot').forEach(root=>{
    const svg=root.querySelector('svg.lines');svg.innerHTML='';
    root.querySelectorAll('.tnode:not(.leaf)').forEach(node=>{
      const lab=node.querySelector(':scope>.tlabel');
      node.querySelectorAll(':scope>.tkids>.tnode, :scope>.tkids>.ghost').forEach((kid,i)=>{
        const tgt=kid.classList.contains('ghost')?kid:kid.querySelector(':scope>.tlabel');
        const k=node.dataset.id+'>'+(kid.dataset.id||'g'+i);keys.add(k);
        const ln=document.createElementNS('http://www.w3.org/2000/svg','line');
        ln.setAttribute('pathLength','1');
        if(!prevLines.has(k)&&!reduceMotion)ln.classList.add('grow');
        if(kid.classList.contains('ghost'))ln.style.strokeDasharray='4 4',ln.style.opacity=kid.classList.contains('opt')?'.28':'.55',ln.removeAttribute('pathLength'),ln.classList.remove('grow');
        svg.appendChild(ln);lineRefs.push({ln,a:lab,b:tgt,root});
      });
    });
  });
  prevLines=keys;updateLines();
}
function updateLines(){
  for(const r of lineRefs){
    const rr=r.root.getBoundingClientRect(),a=r.a.getBoundingClientRect(),b=r.b.getBoundingClientRect();
    r.ln.setAttribute('x1',a.left+a.width/2-rr.left);r.ln.setAttribute('y1',a.bottom-rr.top+2);
    r.ln.setAttribute('x2',b.left+b.width/2-rr.left);r.ln.setAttribute('y2',b.top-rr.top-2);
  }
}

function renderCanvas(){
  FPICK=new Map();
  const before={};canvas.querySelectorAll('[data-id]').forEach(el=>before[el.dataset.id]=el.getBoundingClientRect());
  if(flipFrom&&!before[flipFrom.id])before[flipFrom.id]=flipFrom.rect;flipFrom=null;
  modes={};
  const done=completeRoots();
  canvas.innerHTML=S.roots.map(r=>rRoot(r,done)).join('')+(S.roots.length?'':`<div class="hint-empty">${S.words.length?'Drag a word or a container from the inventory onto the bench.':'Add some words in the inventory, then drag words and containers onto the bench.'}</div>`);
  prevMode=modes;
  // size bench
  let mx=0,my=0;canvas.querySelectorAll('.rootwrap').forEach(w=>{mx=Math.max(mx,w.offsetLeft+w.offsetWidth);my=Math.max(my,w.offsetTop+w.offsetHeight)});
  canvas.style.width=(mx+260)+'px';canvas.style.height=(my+220)+'px';
  // FLIP
  if(!reduceMotion){
    const vis=new Map(),moved=[];
    canvas.querySelectorAll('[data-id]').forEach(el=>{
      const anc=el.parentElement.closest('[data-id]');const pv=anc&&vis.has(anc)?vis.get(anc):[0,0];
      const b=before[el.dataset.id];
      if(!b){vis.set(el,pv);return}
      const a=el.getBoundingClientRect(),abs=[b.left-a.left,b.top-a.top];vis.set(el,abs);
      const dx=abs[0]-pv[0],dy=abs[1]-pv[1];
      if(Math.abs(dx)>.5||Math.abs(dy)>.5){el.style.transition='none';el.style.transform=`translate(${dx}px,${dy}px)`;moved.push(el)}
    });
    if(moved.length){canvas.offsetWidth;moved.forEach(el=>{el.style.transition='transform 380ms cubic-bezier(.2,.8,.2,1)';el.style.transform=''})}
    drawLines();
    const t0=performance.now();(function tick(t){updateLines();if(t-t0<420)requestAnimationFrame(tick)})(t0);
  }else drawLines();
  return done;
}

function completeRoots(){return S.roots.filter(r=>{const n=S.nodes[r];return n.type==='node'&&!isLex(n.cat)&&depth(r)>=2&&fullYield(r)&&deepComplete(r)&&!treeProblem(r)})}

function resolvedCats(){
  const m={};
  (function walk(ids){ids.forEach(id=>{const n=S.nodes[id];if(n.type!=='node')return;const kc=kidCats(n,evalNode(n));n.children.forEach(c=>{if(S.nodes[c].type==='word')m[S.nodes[c].wid]=kc[c]});walk(n.children)})})(S.roots);
  return m;
}
function bracket(id,pick){
  const n=S.nodes[id];
  if(n.type==='empty')return pick&&pick!=='*'?`[${pick} ∅]`:'∅';
  if(n.type==='word'){const t=S.words[n.wid].text;return pick?`[${pick} ${t}]`:t}
  if(isLex(n.cat)){const c=n.children[0];return`[${n.cat} ${c?S.words[S.nodes[c].wid].text:'_'}]`}
  const kc=kidCats(n,evalNode(n));return`[${dispCat(n)} ${n.children.map(c=>bracket(c,kc[c])).join(' ')}]`;
}

function pivotsFor(root){
  const out=[],nodes=subtree(root).filter(id=>id!==root&&S.nodes[id].type==='node'&&!isLex(S.nodes[id].cat));
  for(const p of nodes){
    const X=S.nodes[p].parent,inside=new Set(subtree(p)),alts=[];
    for(const Y of subtree(root)){
      const y=S.nodes[Y];if(Y===X||inside.has(Y)||y.type!=='node'||isLex(y.cat))continue;
      detach(p);attach(p,Y);
      if(fullYield(root)&&deepComplete(root)&&!treeProblem(root))alts.push(Y);
      detach(p);attach(p,X);
    }
    if(alts.length)out.push({p,X,alts});
  }
  return out;
}

/* ---------- score: points for every phrase (two words or more), Block and Clause the first time it is built ----------
   Each finished structure is remembered by its labelled bracketing, so rebuilding the same tree,
   or undoing and redoing, earns nothing new. The score lasts for this visit only; reloading starts at 0. */
const PHRASE_PTS=5,BLOCK_PTS=50,CLAUSE_PTS=100;
let SCORE={points:0,blocks:0,seen:{}};
function phraseDone(id){const n=S.nodes[id];return!!n&&n.type==='node'&&!isLex(n.cat)&&fullYield(id)&&deepComplete(id)&&!treeProblem(id)}
let gainT;
function scoreBench(){
  if(!drag){
    const gains=[];
    for(const id of Object.keys(S.nodes)){
      if(!phraseDone(id))continue;
      const n=S.nodes[id],block=n.cat==='TP',clause=n.cat==='CP';
      /* an ordinary phrase scores only when its rule has two or more required slots, all now filled */
      if(!block&&!clause){const ev=evalNode(n);if(!ev.rule||ev.rule.els.filter(e=>e.min>0).length<2)continue}
      const k=n.cat+' '+bracket(id);
      if(SCORE.seen[k])continue;
      SCORE.seen[k]=1;const pts=clause?CLAUSE_PTS:block?BLOCK_PTS:PHRASE_PTS;SCORE.points+=pts;if(block)SCORE.blocks++;
      gains.push({id,pts,block,clause,text:words(id)});
    }
    if(gains.length){
      const total=gains.reduce((a,g)=>a+g.pts,0),b=gains.find(g=>g.clause)||gains.find(g=>g.block);
      $('#scoreGain').textContent=`+${total}`+(b?` · ${b.clause?'Clause':'Block'} complete`:'');
      const bar=$('#scoreBar');bar.classList.add('show');
      clearTimeout(gainT);gainT=setTimeout(()=>bar.classList.remove('show'),b?3000:2000);
      /* wait for the FLIP animation to settle so the effects land on the boxes' final positions */
      const flashed=gains.filter(g=>g.block||g.clause).map(g=>g.id);
      const inside=g=>{let a=S.nodes[g.id]&&S.nodes[g.id].parent;while(a){if(flashed.includes(a))return true;a=S.nodes[a].parent}return false};
      setTimeout(()=>gains.filter(g=>!((g.block||g.clause)&&inside(g))).forEach(scoreFx),reduceMotion?0:400);
    }
  }
  $('#scorePts').textContent=SCORE.points.toLocaleString();$('#scoreBlocks').textContent=SCORE.blocks.toLocaleString();
}

/* +5 floats up off a finished phrase; a finished Block or Clause flashes green */
function scoreFx(g){
  const el=canvas.querySelector(`[data-id="${g.id}"]`),fx=$('#fx');if(!el||!fx)return;
  const r=el.getBoundingClientRect(),br=bench.getBoundingClientRect();
  const x=r.left-br.left+bench.scrollLeft,y=r.top-br.top+bench.scrollTop;
  const d=document.createElement('div');
  if(g.block||g.clause){d.className='fx-flash';Object.assign(d.style,{left:(x-6)+'px',top:(y-6)+'px',width:(r.width+12)+'px',height:(r.height+12)+'px'})}
  else{d.className='fx-pts';d.textContent=`+${g.pts} points`;Object.assign(d.style,{left:(x+r.width/2)+'px',top:(y+12)+'px'})}
  fx.appendChild(d);d.addEventListener('animationend',()=>d.remove());setTimeout(()=>d.remove(),2500);
}
function renderAll(){
  renderChrome();
  const done=renderCanvas();
  commit();
  scoreBench();
  const used=new Set(Object.values(S.nodes).filter(n=>n.type==='word').map(n=>n.wid));
  const live=S.words.filter(w=>!w.gone);
  $('#wordInv').innerHTML=live.length?live.map(w=>`<span class="word inv-word${used.has(w.idx)?' used':''}${S.edit===w.idx?' editing':''}${onWhite(w.cats)}" data-inv="word" data-k="${w.idx}" style="background:${chipBg(w.cats,w.idx)}" title="${w.cats.join(' / ')}${w.cats.includes('V')?' · verb: '+wordFrames(w.idx).map(f=>FRAMES[f].name.toLowerCase()).join(', '):''}">${esc(w.text)}${w.cats.length>1?`<small>${w.cats.join('·')}</small>`:''}</span>`).join(''):`<span class="inv-empty">No words yet.</span>`;
  $('#wordCount').textContent=live.length?`${used.size}/${live.length} on bench`:'';
  const ew=S.words[S.edit],we=$('#wedit');
  if(ew&&!ew.gone){we.hidden=false;we.innerHTML=`<div class="wedit-head"><b>${esc(ew.text)}</b><span>can be</span><button class="btn small" type="button" data-wclose>Done</button></div><div class="wedit-pos">${LEX.map(c=>`<button type="button" class="posbtn${onWhite([c])}" data-pos="${c}" aria-pressed="${ew.cats.includes(c)}" style="--c:${COLORS[c]}">${c}</button>`).join('')}</div>${ew.cats.includes('V')?`<div class="wedit-head"><span>as a verb it takes</span></div><div class="wedit-pos">${FKEYS.map(f=>`<button type="button" class="posbtn" data-frame="${f}" aria-pressed="${wordFrames(ew.idx).includes(f)}" title="${esc(FRAMES[f].hint)}" style="--c:${FRAMECOL[f]}">${FRAMES[f].name}</button>`).join('')}</div>`:''}<button class="btn small danger" type="button" data-wremove>${used.has(ew.idx)?'Remove word (also from the bench)':'Remove word'}</button>`}
  else we.hidden=true;
  const pieces=S.roots.filter(r=>S.nodes[r].type==='node');
  $('#status').innerHTML=pieces.length?`<div class="bracket"><span class="k">Labelled bracketing</span>${pieces.map(r=>`<code>${esc(bracket(r))}</code>`).join('')}</div>`:'';
  const rd=$('#readings');
  const pv=done.flatMap(pivotsFor);
  if(pv.length){
    rd.hidden=false;
    rd.innerHTML=`<h3>Other attachments</h3><p>These phrases can clip onto a different node without breaking the grammar or the word order. Pivot one to watch the branches shift.</p>`+
    pv.map(o=>{const p=S.nodes[o.p],x=S.nodes[o.X];
      return`<div class="reading"><p>“${esc(words(o.p))}” (${dispCat(p)}) attaches to <b>${dispCat(x)}</b> “${esc(words(o.X))}”.</p><div class="opts">${o.alts.map(Y=>{const y=S.nodes[Y];return`<button class="pivot" data-p="${o.p}" data-y="${Y}">Pivot onto <b>${dispCat(y)}</b> “${esc(words(Y))}”</button>`}).join('')}</div></div>`}).join('');
  }else rd.hidden=true;
}

/* ---------- chrome ---------- */
function ruleChips(line){
  const R1=parseRules(line),r=Object.values(R1)[0][0];
  return`<span>${esc(shown(r.lhs))}</span><span class="arr">→</span>${r.toks.map((t,i)=>{const a=r.els[i].alts[0];if(r.els[i].comps)return`<span class="compsc" title="Whatever the verb's frame asks for">${esc(tokLabel(t))}</span>`;return isLex(a)?`<span class="lexc" style="--c:${COLORS[a]}">${esc(tokLabel(t))}</span>`:`<span>${esc(toDisplay(t))}</span>`}).join('')}`;
}
function ruleFormHTML(){
  return`<form class="ruleform" id="ruleForm"><input id="ruleInput" aria-label="Rule" placeholder="QP -> (Deg) Q (PP+)" value="${esc(ruleForm.text||'')}" autocomplete="off" spellcheck="false">
  <div class="rf-row"><button class="btn small" type="submit">${ruleForm.index<0?'Add rule':'Save'}</button><button class="btn small" type="button" data-rulecancel>Cancel</button><span class="rf-help">(X) optional · X+ repeatable · {A/B} either</span></div>
  ${ruleForm.err?`<p class="formerr">${esc(ruleForm.err)}</p>`:''}</form>`;
}
function renderChrome(){
  let lg=LEX.map(c=>legendEdit
    ?`<span class="inv-lex legend editable" data-editclass="${c}" role="button" tabindex="0" title="Edit ${esc(LEXNAMES[c])}" style="--c:${COLORS[c]}">${esc(LEXNAMES[c])}<small>${esc(c)}</small><button class="lx" type="button" data-delclass="${c}" aria-label="Remove ${esc(LEXNAMES[c])}">×</button></span>`
    :`<span class="inv-lex legend" style="--c:${COLORS[c]}">${esc(LEXNAMES[c])}</span>`).join('');
  if(legendEdit&&!classForm)lg+=`<button class="btn small" type="button" data-addclass>+ Word class</button>`;
  if(legendEdit)lg+=`<button class="btn small legend-toggle" type="button" data-legendedit aria-pressed="true">Done</button>`;
  if(classForm){const f=classForm;
    lg+=`<form class="classform" id="classForm"><input id="cfTag" aria-label="Abbreviation" placeholder="Abbreviation, e.g. Pron" value="${esc(f.tag||'')}" ${f.mode==='edit'?'disabled':''} autocomplete="off"><input id="cfName" aria-label="Full name" placeholder="Full name, e.g. Pronoun" value="${esc(f.name||'')}" autocomplete="off"><input id="cfColor" type="color" aria-label="Color" value="${f.color}"><button class="btn small" type="submit">${f.mode==='edit'?'Save':'Add class'}</button><button class="btn small" type="button" data-cfcancel>Cancel</button>${f.err?`<p class="formerr">${esc(f.err)}</p>`:''}</form>`}
  $('#lexInv').innerHTML=lg;
  $('#phrInv').innerHTML=[...PHRASES,...COORD].map(c=>{const h=headOf(c);return`<span class="inv-phr${h?' headed':''}" data-inv="class" data-cat="${c}"${h?` style="--c:${COLORS[h]}"`:''}>${esc(shown(c))}</span>`}).join('')+`<span class="inv-phr nullpill" data-inv="empty">∅</span>`;
  $('#ruleList').innerHTML=G.rules.map((line,i)=>ruleForm&&ruleForm.index===i?ruleFormHTML()
      :`<div class="rule editable" data-editrule="${i}" title="Click to edit">${ruleChips(line)}<button class="rx" type="button" data-delrule="${i}" aria-label="Delete rule">×</button></div>`).join('')
    +`<div class="rule builtin conds"><em class="rule-note"><b>Built-in conditions.</b> ∅ can be an understood subject only in a to-clause, an -ing/-ed clause, a command, or after a fronted wh- or relative word; it can stand for a verb only when an auxiliary or "be" has moved into C (Is he ∅ happy?). Only all, both, half or such can precede another determiner. A clause used as a subject needs a complementizer or a ∅ subject.</em></div>`
    +`<div class="rule builtin frames"><span class="compsc">Comps</span><span class="arr">→</span><em class="rule-note">Built in. Filled by the verb's frame. ${FKEYS.map(f=>`<span class="lexc" style="--c:${FRAMECOL[f]}">${FRAMES[f].name}</span> ${FRAMES[f].pat?esc(toDisplay(FRAMES[f].pat)):'nothing'}`).join(' · ')}. Tap a verb in the inventory to set its frames.</em></div>`
    +`<div class="rule builtin"><span>Coord</span><span class="arr">→</span><span>X+</span><span class="lexc" style="--c:${COLORS.Conj||'#888'}">Conj</span><span>X</span><em class="rule-note">Built in. X is any word class or phrase, the same throughout, so lists like red, white and blue work. Clauses and sentences can also be joined with ;</em></div>`

    +(ruleForm&&ruleForm.index<0?ruleFormHTML():`<div class="rule-actions"><button class="btn small" type="button" data-addrule>+ New rule</button><button class="btn small" type="button" data-legendedit aria-pressed="${legendEdit}">${legendEdit?'Done editing classes':'Edit word classes'}</button><button class="linkbtn" type="button" data-resetgrammar>Reset to default grammar</button></div>`);
  const ri=$('#ruleInput');if(ri&&ruleForm.focus){ri.focus();ri.setSelectionRange(ri.value.length,ri.value.length);ruleForm.focus=false}
  const ct=$('#cfName');if(ct&&classForm.focus){(classForm.mode==='add'?$('#cfTag'):ct).focus();classForm.focus=false}
}
function removeNode(id){
  const n=S.nodes[id];if(!n)return;
  let pos={x:40,y:40};const el=canvas.querySelector(`[data-id="${id}"]`)||canvas.querySelector(`[data-del="${id}"]`);
  if(el){const r=el.getBoundingClientRect(),cr=canvas.getBoundingClientRect();pos={x:r.left-cr.left,y:r.top-cr.top}}
  const oldParent=n.parent;detach(id);let k=0;
  if(n.type==='node')[...n.children].forEach(c=>{const cn=S.nodes[c];cn.parent=null;if(cn.type==='word')delTree(c);else{setRoot(c,pos.x+k*28,pos.y+36+k*64);k++}});
  delete S.nodes[id];if(oldParent)dropEmptyAuto(oldParent);S.sel=null;renderAll();
  toast(n.type==='word'?`Returned “${S.words[n.wid].text}” to the inventory.`:`Deleted ${dispCat(n)}.`+(k?' Its phrases stay on the bench.':''));
}
/* ---------- history ---------- */
const snap=()=>JSON.stringify({words:S.words,nodes:S.nodes,roots:S.roots,g:G});
function loadSnap(str){const o=JSON.parse(str);S={words:o.words||[],nodes:o.nodes||{},roots:o.roots||[],sel:null,edit:null};
  G=o.g&&o.g.pos&&o.g.rules?o.g:cloneG(DEFAULT_GRAMMAR);applyGrammar();
  uid=Math.max(uid,0,...Object.keys(S.nodes).map(k=>+k.slice(1)||0))}
let undoStack=[],redoStack=[],lastSnap=null;
function commit(){
  if(drag)return;
  const now=snap();
  if(lastSnap!==null&&now!==lastSnap){undoStack.push(lastSnap);if(undoStack.length>150)undoStack.shift();redoStack=[]}
  lastSnap=now;
  $('#undoBtn').disabled=!undoStack.length;$('#redoBtn').disabled=!redoStack.length;
  $('#clearBtn').disabled=!S.words.length&&!S.roots.length;
}
function undo(){if(!undoStack.length)return;redoStack.push(lastSnap);const prev=undoStack.pop();loadSnap(prev);lastSnap=prev;renderAll()}
function redo(){if(!redoStack.length)return;undoStack.push(lastSnap);const nx=redoStack.pop();loadSnap(nx);lastSnap=nx;renderAll()}
function clearAll(){S={words:[],nodes:{},roots:[],sel:null,edit:null};renderAll();toast('Cleared. Undo brings it back.')}

/* ---------- SVG export: redraws the bench as real vector shapes and text ---------- */
function svgEsc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function isClear(c){return !c||c==='transparent'||/rgba\([^)]*,\s*0\)$/.test(c)}
function buildSVG(){
  const roots=[...canvas.querySelectorAll('.rootwrap')];if(!roots.length)return null;
  const cr=canvas.getBoundingClientRect();let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  roots.forEach(r=>{const b=r.getBoundingClientRect();x0=Math.min(x0,b.left);y0=Math.min(y0,b.top);x1=Math.max(x1,b.right);y1=Math.max(y1,b.bottom)});
  const pad=24,ox=x0-pad,oy=y0-pad,W=Math.ceil(x1-x0+pad*2),H=Math.ceil(y1-y0+pad*2);
  const rootCS=getComputedStyle(document.body),benchBg=getComputedStyle(bench).backgroundColor;
  const out=[];let gid=0;const defs=[];
  const X=v=>(v-ox).toFixed(1),Y=v=>(v-oy).toFixed(1);
  const skip=el=>el.closest('.del,.optbtn');
  // shapes, in document order so later elements sit on top
  roots.forEach(root=>{
    root.querySelectorAll('svg.lines line').forEach(l=>{
      const svg=l.ownerSVGElement.getBoundingClientRect();const cs=getComputedStyle(l);
      out.push(`<line x1="${X(svg.left+ +l.getAttribute('x1'))}" y1="${Y(svg.top+ +l.getAttribute('y1'))}" x2="${X(svg.left+ +l.getAttribute('x2'))}" y2="${Y(svg.top+ +l.getAttribute('y2'))}" stroke="${cs.stroke}" stroke-width="${cs.strokeWidth}" stroke-linecap="round"${l.style.strokeDasharray?` stroke-dasharray="${l.style.strokeDasharray}"`:''}${l.style.opacity?` opacity="${l.style.opacity}"`:''}/>`);
    });
    [root,...root.querySelectorAll('*')].forEach(el=>{
      if(el instanceof SVGElement||skip(el))return;
      const cs=getComputedStyle(el);if(cs.display==='none'||cs.visibility==='hidden')return;
      const b=el.getBoundingClientRect();if(!b.width||!b.height)return;
      const op=cs.opacity!=='1'?` opacity="${cs.opacity}"`:'';const rx=Math.min(parseFloat(cs.borderTopLeftRadius)||0,b.height/2);
      const bgImg=cs.backgroundImage;let fill=null;
      if(bgImg&&bgImg.startsWith('linear-gradient')){
        const stops=[...bgImg.matchAll(/(rgba?\([^)]*\))\s+([\d.]+)%(?:\s+([\d.]+)%)?/g)];
        if(stops.length){const id='g'+(gid++);const parts=[];stops.forEach(m=>{parts.push(`<stop offset="${m[2]}%" stop-color="${m[1]}"/>`);if(m[3])parts.push(`<stop offset="${m[3]}%" stop-color="${m[1]}"/>`)});
          defs.push(`<linearGradient id="${id}" x1="0" y1="0" x2="1" y2="0.55">${parts.join('')}</linearGradient>`);fill=`url(#${id})`}
      }
      if(!fill&&!isClear(cs.backgroundColor)&&cs.backgroundColor!==benchBg)fill=cs.backgroundColor;
      const bw=parseFloat(cs.borderTopWidth)||0,bbw=parseFloat(cs.borderBottomWidth)||0;
      const allBorder=bw>0&&cs.borderTopStyle!=='none'&&parseFloat(cs.borderLeftWidth)>0;
      if(fill||allBorder){
        const dash=cs.borderTopStyle==='dashed'?` stroke-dasharray="${(bw*3).toFixed(1)} ${(bw*2).toFixed(1)}"`:'';
        const stroke=allBorder&&!isClear(cs.borderTopColor)?` stroke="${cs.borderTopColor}" stroke-width="${bw}"${dash}`:'';
        out.push(`<rect x="${X(b.left+bw/2)}" y="${Y(b.top+bw/2)}" width="${(b.width-bw).toFixed(1)}" height="${(b.height-bw).toFixed(1)}" rx="${Math.max(0,rx-bw/2).toFixed(1)}" fill="${fill||'none'}"${stroke}${op}/>`);
      }else if(bbw>0&&cs.borderBottomStyle!=='none'&&!isClear(cs.borderBottomColor)){
        out.push(`<rect x="${X(b.left)}" y="${Y(b.bottom-bbw)}" width="${b.width.toFixed(1)}" height="${bbw}" fill="${cs.borderBottomColor}"${op}/>`);
      }
    });
    // text, measured from the page so it lands exactly where it is drawn
    const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let tn;
    while((tn=tw.nextNode())){
      const txt=tn.nodeValue;if(!txt.trim())continue;const el=tn.parentElement;if(!el||skip(el))continue;
      const cs=getComputedStyle(el);if(cs.display==='none')continue;
      const rg=document.createRange();rg.selectNodeContents(tn);const b=rg.getBoundingClientRect();if(!b.width)continue;
      let o=1;for(let a=el;a&&a!==canvas;a=a.parentElement)o*=parseFloat(getComputedStyle(a).opacity)||1;
      out.push(`<text x="${X(b.left)}" y="${Y(b.top+b.height/2)}" dominant-baseline="central" font-family="${svgEsc(cs.fontFamily)}" font-size="${cs.fontSize}" font-weight="${cs.fontWeight}" fill="${cs.color}"${o<1?` opacity="${o.toFixed(2)}"`:''} xml:space="preserve">${svgEsc(txt.trim())}</text>`);
    }
  });
  return`<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">\n<title>Syntax tree</title>\n<defs>${defs.join('')}</defs>\n<rect width="100%" height="100%" fill="${benchBg}"/>\n${out.join('\n')}\n</svg>\n`;
}
async function exportSVG(){
  if(S.sel){S.sel=null;renderAll();await new Promise(r=>setTimeout(r,450))}
  const svg=buildSVG();if(!svg){toast('Put something on the bench first, then export it.');return}
  const filename='syntax-tree.svg';
  let dl=null;
  if(window.claude&&window.claude.use){try{dl=await window.claude.use('downloads')}catch(e){dl=null}}
  if(dl){
    try{await dl.save({filename,data:svg});toast('Saved syntax-tree.svg.')}
    catch(err){const c=err&&err.code;if(c==='declined')return;if(c==='rate_limited'){toast('A save prompt is already open.');return}toast('Saving files isn\'t available in this view.')}
    return;
  }
  if(window.claude){toast('Saving files isn\'t available in this view.');return}
  const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
}

/* ---------- tap-to-add placement ---------- */
function nextRowY(){let y=0;canvas.querySelectorAll('.rootwrap').forEach(w=>{y=Math.max(y,w.offsetTop+w.offsetHeight)});return y?y+18:16}
function reveal(y){
  bench.scrollTo({top:Math.max(0,y-40),behavior:reduceMotion?'auto':'smooth'});
  const r=bench.getBoundingClientRect();
  if(r.top<0||r.top>innerHeight*.6)bench.scrollIntoView({behavior:reduceMotion?'auto':'smooth',block:'start'});
}
function placeWord(k){const y=nextRowY();setRoot(mkWord(k).id,16,y);renderAll();reveal(y)}
function placeContainer(h){
  const n=h.dataset.inv==='empty'?mkEmpty():mkNode(h.dataset.cat);
  const y=nextRowY();setRoot(n.id,16,y);renderAll();reveal(y);
}
function addWords(text){
  /* possessive 's (or a bare ' after plural s) splits off as its own determiner: the man + 's + hat */
  const CONTR=new Set(["it's","he's","she's","that's","what's","there's","here's","who's","where's","let's","how's","when's","why's"]);
  const toks=text.replace(/[.?!,:"“”()]/g,' ').replace(/;/g,' ; ').split(/\s+/).filter(Boolean)
    .flatMap(t=>{const l=t.toLowerCase().replace(/’/g,"'");if(CONTR.has(l))return[t];
      let m=t.match(/^(.+?)(['’]s)$/);if(m)return[m[1],m[2]];m=t.match(/^(.+s)(['’])$/);if(m)return[m[1],m[2]];return[t]});
  const isPossMark=t=>/^['’]s?$/.test(t);
  const wordToks=toks.filter(t=>t!==';'&&!isPossMark(t));
  const tagged=tagWords(wordToks).map(cs=>{cs=cs.filter(c=>LEX.includes(c));return cs.length?cs:[LEX.includes('N')?'N':LEX[0]]});
  let wi=0;const cats=toks.map(t=>t===';'?['Semi']:isPossMark(t)?['D']:tagged[wi++]);
  const y0=nextRowY(),limit=Math.max(280,bench.clientWidth-40);let x=16,y=y0;
  toks.forEach((t,i)=>{
    const w={text:t,idx:S.words.length,cats:cats[i]};S.words.push(w);
    const wd=t.length*9.5+30+(w.cats.length>1?w.cats.length*14+12:0);
    if(x>16&&x+wd>limit){x=16;y+=46}
    setRoot(mkWord(w.idx).id,x,y);x+=wd+10;
  });
  renderAll();reveal(y0);
}

function wordEditAction(e){
  const t=e.target.closest&&e.target.closest('#wedit [data-pos],#wedit [data-frame],#wedit [data-wclose],#wedit [data-wremove]');if(!t)return false;

  if(t.dataset.pos!==undefined&&w){const c=t.dataset.pos;if(w.cats.includes(c)){if(w.cats.length>1)w.cats=w.cats.filter(x=>x!==c);else toast('A word needs at least one class.')}else w.cats.push(c);w.cats.sort((a,b)=>LEX.indexOf(a)-LEX.indexOf(b))}
  else if(t.dataset.frame!==undefined&&w){const f=t.dataset.frame,cur=[...wordFrames(w.idx)];if(cur.includes(f)){if(cur.length>1)w.frames=cur.filter(x=>x!==f);else toast('A verb needs at least one frame.')}else w.frames=[...cur,f]}

document.addEventListener('input',e=>{

  if(classForm){if(e.target.id==='cfTag')classForm.tag=e.target.value.trim();if(e.target.id==='cfName')classForm.name=e.target.value;if(e.target.id==='cfColor')classForm.color=e.target.value}

  if(e.target.id==='ruleForm'){e.preventDefault();
    const line=fromDisplay(($('#ruleInput').value||'').trim()),err=checkRule(line,ruleForm.index);
    if(err){ruleForm.text=toDisplay(line);ruleForm.err=toDisplay(err);ruleForm.focus=true;renderChrome();return}
    const n=normRule(line);if(ruleForm.index<0)G.rules.push(n);else G.rules[ruleForm.index]=n;
    const isNew=!PHRASES.includes(lhsOf(n));ruleForm=null;applyGrammar();renderAll();
    toast(isNew?`Added ${lhsOf(n)}. It's in your containers now.`:'Rule saved.');return}
  if(e.target.id==='classForm'){e.preventDefault();const f=classForm;let err=null;
    if(f.mode==='add'){

    }

    else{const p=G.pos.find(p=>p.tag===f.tag);p.name=f.name.trim();p.color=f.color}

document.addEventListener('pointerdown',e=>{

  if(drag)moveDrag(e);
});
document.addEventListener('pointerup',e=>{if(drag)endDrag(e);else if(pending&&(pending.h.dataset.inv==='class'||pending.h.dataset.inv==='empty'))placeContainer(pending.h);else if(pending&&pending.h.dataset.inv==='word'){const k=+pending.h.dataset.k;
    if(!isUsed(k))placeWord(k);
    else if(!S.words[k].cats.some(c=>c in PUNCT)){S.edit=S.edit===k?null:k;renderAll()}}else if(pending&&pending.h.dataset.drag&&S.nodes[pending.h.dataset.drag]){S.sel=pending.h.dataset.drag;renderAll()}pending=null});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&e.target.id==='ruleInput'){ruleForm=null;renderChrome();return}
  if(e.key==='Escape'&&e.target.closest&&e.target.closest('#classForm')){classForm=null;renderChrome();return}

  if(e.target.closest&&e.target.closest('input,textarea'))return;
  const mod=e.ctrlKey||e.metaKey,k=e.key.toLowerCase();
  if(mod&&k==='z'){e.preventDefault();e.shiftKey?redo():undo();return}
  if(mod&&k==='y'){e.preventDefault();redo();return}
  if((e.key==='Delete'||e.key==='Backspace')&&S.sel&&S.nodes[S.sel]){e.preventDefault();removeNode(S.sel)}
  else if(e.key==='Escape'&&S.sel){S.sel=null;renderAll()}
});

function ghostHTML(id){

  if(n.type==='word'){const w=S.words[n.wid];return`<span class="word" style="background:${chipBg(w.cats)}">${esc(w.text)}</span>`}
  const ws=words(id),c=isLex(n.cat)?` style="--c:${COLORS[n.cat]}"`:'';
  return`<span class="gchip"${c}><b>${dispCat(n)}</b>${ws?esc(ws):''}</span>`;
}
/* the ghost is a faithful copy of what was picked up, held at the grab point */
function ghostLines(root){
  const svg=root.querySelector(':scope>svg.lines');if(!svg)return;svg.innerHTML='';const rr=root.getBoundingClientRect();
  root.querySelectorAll('.tnode:not(.leaf)').forEach(node=>{
    const a=node.querySelector(':scope>.tlabel').getBoundingClientRect();
    node.querySelectorAll(':scope>.tkids>.tnode, :scope>.tkids>.ghost').forEach(kid=>{
      const t=(kid.classList.contains('ghost')?kid:kid.querySelector(':scope>.tlabel')).getBoundingClientRect();
      const ln=document.createElementNS('http://www.w3.org/2000/svg','line');
      ln.setAttribute('x1',a.left+a.width/2-rr.left);ln.setAttribute('y1',a.bottom-rr.top+2);
      ln.setAttribute('x2',t.left+t.width/2-rr.left);ln.setAttribute('y2',t.top-rr.top-2);
      if(kid.classList.contains('ghost')){ln.style.strokeDasharray='4 4';ln.style.opacity=kid.classList.contains('opt')?'.28':'.55'}
      svg.appendChild(ln);
    });
  });
}
function makeGhost(id,src,p){
  const g=document.createElement('div');g.className='ghost-drag';
  const inner=document.createElement('div');inner.className='ghost-inner';g.appendChild(inner);
  let grab,isTree=false;
  if(src){
    const r=src.getBoundingClientRect(),c=src.cloneNode(true);
    c.querySelectorAll('.del,.optbtn').forEach(x=>x.remove());
    [c,...c.querySelectorAll('*')].forEach(x=>{['data-id','data-drop','data-drag','data-parent','data-inv'].forEach(a=>x.removeAttribute(a));x.classList&&x.classList.remove('selected','can-drop','drop-ok','drop-no','morph','used','editing')});
    c.style.transform='';c.style.transition='';
    isTree=src.classList.contains('tnode');
    if(isTree){const t=document.createElement('div');t.className='troot ghost-tree';t.innerHTML='<svg class="lines" aria-hidden="true"></svg>';t.appendChild(c);inner.appendChild(t)}
    else inner.appendChild(c);
    grab={x:p.x-r.left+(isTree?16:0),y:p.y-r.top+(isTree?12:0)};
  }else{
    isTree=true;inner.innerHTML=`<div class="troot ghost-tree"><svg class="lines" aria-hidden="true"></svg>${rTree(id)}</div>`;
    inner.querySelectorAll('[data-id],[data-drop],[data-drag],[data-parent]').forEach(x=>['data-id','data-drop','data-drag','data-parent'].forEach(a=>x.removeAttribute(a)));
  }
  document.body.appendChild(g);
  if(isTree)ghostLines(g.querySelector('.troot'));
  if(!grab){const gr=g.getBoundingClientRect(),lr=g.querySelector('.tlabel').getBoundingClientRect();grab={x:lr.left-gr.left+lr.width/2,y:lr.top-gr.top+lr.height/2}}
  inner.style.transformOrigin=`${grab.x}px ${grab.y}px`;
  /* hotspot: the centre of the dragged piece's own top label (or chip), so drops follow what you're carrying, not where you grabbed it */
  const gr=g.getBoundingClientRect(),head=g.querySelector('.tlabel')||inner.firstElementChild,hr=head.getBoundingClientRect();
  const hot={x:hr.left-gr.left+hr.width/2,y:hr.top-gr.top+hr.height/2};
  return{g,grab,hot};
}
let flipFrom=null;
function startDrag(p){
  const h=p.h;let id,isNew=false,origin=null;
  if(h.dataset.inv==='word'){id=mkWord(+h.dataset.k).id;isNew=true}
  else if(h.dataset.inv==='class'){id=mkNode(h.dataset.cat).id;isNew=true}
  else if(h.dataset.inv==='empty'){id=mkEmpty().id;isNew=true}
  let src=null;
  if(h.dataset.inv==='word')src=h;
  else if(!isNew){id=h.dataset.drag;const n=S.nodes[id];if(!n)return;
    src=canvas.querySelector(`[data-id="${id}"]`)||h;
    origin={parent:n.parent,ord:n.ord,x:n.x,y:n.y}}
  const {g,grab,hot}=makeGhost(id,src,p);
  if(!isNew)detach(id);
  drag={id,isNew,origin,ghost:g,grab,hot,target:null,hl:null};
  g.style.transform=`translate(${p.x-grab.x}px,${p.y-grab.y}px)`;
  document.body.classList.add('dragging');
  if(!isNew)renderAll();
  // mark every container that would accept this piece
  for(const nid of S.roots.flatMap(subtree)){
    const n=S.nodes[nid];if(n.type!=='node')continue;
    if(candOrds(nid).some(o=>tryAttach(id,nid,o).ok)){const el=canvas.querySelector(`[data-id="${nid}"]`);el&&el.classList.add('can-drop')}
  }
}
function ordAt(cid,x){
  const kids=S.nodes[cid].children;if(!kids.length)return 0;
  const cs=kids.map(k=>{const el=canvas.querySelector(`[data-id="${k}"]`);const r=el?el.getBoundingClientRect():{left:0,width:0};return{k:key(k),cx:r.left+r.width/2}});
  const p=cs.filter(c=>c.cx<x).length;
  if(p===0)return cs[0].k-.5;if(p===cs.length)return cs[cs.length-1].k+.5;return(cs[p-1].k+cs[p].k)/2;
}
function moveDrag(e){
  drag.ghost.style.transform=`translate(${e.clientX-drag.grab.x}px,${e.clientY-drag.grab.y}px)`;
  if(drag.hl){drag.hl.classList.remove('drop-ok','drop-no');drag.hl=null}
  const br=bench.getBoundingClientRect(),m=36;
  if(e.clientX>br.left&&e.clientX<br.right&&e.clientY>br.top&&e.clientY<br.bottom){
    if(e.clientX>br.right-m)bench.scrollLeft+=10;else if(e.clientX<br.left+m)bench.scrollLeft-=10;
    if(e.clientY>br.bottom-m)bench.scrollTop+=10;else if(e.clientY<br.top+m)bench.scrollTop-=10;
  }
  const hx=e.clientX-drag.grab.x+drag.hot.x,hy=e.clientY-drag.grab.y+drag.hot.y;
  const el=document.elementFromPoint(hx,hy);drag.target=null;if(!el)return;
  const cont=el.closest('#canvas [data-drop]'),dock=el.closest('[data-dock]');
  if(cont){
    const cid=cont.dataset.id,ord=ordAt(cid,hx),res=tryAttach(drag.id,cid,ord);
    cont.classList.add(res.ok?'drop-ok':'drop-no');drag.hl=cont;drag.target={kind:'node',cid,ord,res};
  }else if(dock){dock.classList.add('drop-ok');drag.hl=dock;drag.target={kind:'inv'}}
  else if(el.closest('#bench')){const cr=canvas.getBoundingClientRect();drag.target={kind:'canvas',x:e.clientX-drag.grab.x-cr.left,y:e.clientY-drag.grab.y-cr.top}}
}
function restore(){
  const {id,isNew,origin}=drag;
  if(isNew||!S.nodes[id]){if(S.nodes[id])delTree(id);return}
  if(origin.parent&&S.nodes[origin.parent])attach(id,origin.parent,origin.ord);else setRoot(id,origin.x??40,origin.y??40);
}
function endDrag(){
  const t=drag.target,id=drag.id;
  if(!t)restore();
  let moved=!!t;
  if(t&&t.kind==='node'){
    if(t.res.ok){if(t.res.wrap){const w=mkNode(t.res.wrap);w.auto=true;attach(id,w.id);attach(w.id,t.cid,t.ord)}else attach(id,t.cid,t.ord)}
    else{if(t.res.reason)toast(t.res.reason);restore();moved=false}
  }
  else if(t&&t.kind==='canvas')setRoot(id,t.x,t.y);
  else if(t&&t.kind==='inv')delTree(id);
  if(moved&&drag.origin&&drag.origin.parent)dropEmptyAuto(drag.origin.parent);
  finish();
}
function finish(){
  if(drag.hl)drag.hl.classList.remove('drop-ok','drop-no');
  const gt=drag.ghost.querySelector('.ghost-tree>.tnode')||drag.ghost.querySelector('.ghost-inner>*');
  if(gt&&S.nodes[drag.id])flipFrom={id:drag.id,rect:gt.getBoundingClientRect()};
  drag.ghost.remove();document.body.classList.remove('dragging');drag=null;renderAll();
}

try{localStorage.removeItem('syntax-tree-sandbox-v1')}catch(e){} /* clear state saved by earlier versions */
renderAll();
</script>
